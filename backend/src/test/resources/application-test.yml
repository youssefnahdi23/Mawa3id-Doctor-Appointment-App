spring:
  datasource:
    url: jdbc:h2:mem:mawa3id;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false
  flyway:
    enabled: false

# JWT secret is intentionally omitted: tests run with the app's ephemeral
# auto-generated signing key (see JwtService). No secret is committed.
mawa3id:
  jwt:
    expiration-ms: 86400000
  ratelimit:
    # Off by default so the shared integration suite (many auth calls from one IP per
    # run) isn't throttled. RateLimitingIntegrationTest re-enables it via @SpringBootTest
    # properties with a low capacity.
    enabled: false
  donation:
    # Card donations exercised via StubPaymentGateway (test profile). A Patreon URL is
    # set so the /api/donations/config test asserts a concrete value.
    patreon-url: https://patreon.com/mawa3id-test
