spring:
  application:
    name: mawa3id-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mawa3id}
    username: ${DB_USERNAME:mawa3id}
    # No default: provide the database password via the DB_PASSWORD environment variable.
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

mawa3id:
  jwt:
    # Provide a Base64-encoded key (>= 256 bits) via JWT_SECRET. When left blank the
    # app generates an ephemeral key at startup (fine for local/dev; tokens do not
    # survive restarts). Always set JWT_SECRET in staging/production.
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION:86400000}
    # Set JWT_FAIL_ON_MISSING_SECRET=true in staging/production so the app refuses to
    # boot with a throwaway ephemeral key instead of silently accepting one.
    fail-on-missing-secret: ${JWT_FAIL_ON_MISSING_SECRET:false}
  auth:
    refresh:
      # Refresh-token session lifetime. Access tokens are short-lived (mawa3id.jwt.expiration-ms);
      # the refresh token lets clients obtain new ones without re-authenticating.
      ttl-days: ${AUTH_REFRESH_TTL_DAYS:30}
    challenge:
      # Email/phone verification and password-reset secrets: how long they stay valid and
      # how many wrong guesses a single code tolerates before it is burned.
      ttl-seconds: ${AUTH_CHALLENGE_TTL_SECONDS:900}
      max-attempts: ${AUTH_CHALLENGE_MAX_ATTEMPTS:5}
      code-digits: ${AUTH_CHALLENGE_CODE_DIGITS:6}
    delivery:
      # How verification/reset secrets are delivered until a real email/SMS provider is wired.
      #   log      - log the secret at WARN (DEVELOPMENT ONLY).
      #   disabled - refuse delivery with 503 so an unconfigured server fails loudly.
      # Set AUTH_DELIVERY_MODE=disabled in staging/production until a ChallengeSender is configured.
      mode: ${AUTH_DELIVERY_MODE:log}
  ratelimit:
    # Per-IP fixed-window throttle on the public auth endpoints (login/register/refresh/reset).
    enabled: ${RATELIMIT_ENABLED:true}
    auth:
      capacity: ${RATELIMIT_AUTH_CAPACITY:10}
      window-seconds: ${RATELIMIT_AUTH_WINDOW_SECONDS:60}
  donation:
    # Card donations via Stripe Checkout. Secrets are provided via environment
    # variables; nothing sensitive is committed. Set DONATIONS_ENABLED=false to turn
    # off card donations (the Patreon link can still be surfaced).
    enabled: ${DONATIONS_ENABLED:true}
    currency: ${DONATION_CURRENCY:usd}
    min-amount-minor: ${DONATION_MIN_AMOUNT_MINOR:100}
    patreon-url: ${PATREON_URL:}
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
      success-url: ${STRIPE_SUCCESS_URL:http://localhost:8080/donation/success}
      cancel-url: ${STRIPE_CANCEL_URL:http://localhost:8080/donation/cancel}
    # Konnect (Tunisian aggregator: D17, Flouci wallet, local cards). The method is
    # offered only when both the API key and receiver wallet id are provided.
    konnect:
      api-key: ${KONNECT_API_KEY:}
      wallet-id: ${KONNECT_WALLET_ID:}
      base-url: ${KONNECT_BASE_URL:https://api.konnect.network/api/v2}
      currency: ${KONNECT_CURRENCY:tnd}
      webhook-url: ${KONNECT_WEBHOOK_URL:}
    # Manual bank transfer (RIB); surfaced to donors when the number is set.
    rib:
      account-holder: ${RIB_ACCOUNT_HOLDER:}
      bank-name: ${RIB_BANK_NAME:}
      number: ${RIB_NUMBER:}
      currency: ${RIB_CURRENCY:tnd}
  clinic:
    # Single-region clinic time zone. All appointment times are clinic-local and every "now"
    # comparison (slot computation, bookability, reminders) is evaluated in this zone rather
    # than the JVM default. IANA zone id, e.g. Africa/Casablanca.
    zone: ${CLINIC_ZONE:UTC}
  notifications:
    reminder:
      # Scheduled job that reminds both parties of upcoming ACCEPTED appointments. The scan
      # is idempotent per appointment. Disable it (or widen the window) via env vars.
      enabled: ${NOTIFICATIONS_REMINDER_ENABLED:true}
      window-hours: ${NOTIFICATIONS_REMINDER_WINDOW_HOURS:24}
      cron: ${NOTIFICATIONS_REMINDER_CRON:0 0 * * * *}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
