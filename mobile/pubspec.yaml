name: mawa3id
description: Mawa3id — Flutter mobile client for the appointment-booking backend.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  dio: ^5.8.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  go_router: ^15.1.4
  intl: ^0.20.1
  json_annotation: ^4.9.0
  shared_preferences: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.15
  json_serializable: ^6.9.4
  mocktail: ^1.0.4

flutter:
  generate: true
