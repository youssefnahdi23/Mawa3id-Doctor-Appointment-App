name: mawa3id
description: Mawa3id — Flutter mobile client for the appointment-booking backend.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  dio: ^5.8.0
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  go_router: ^17.3.0
  intl: ^0.20.1
  json_annotation: ^4.12.0
  shared_preferences: ^2.5.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  build_runner: ^2.4.15
  flutter_lints: ^5.0.0
  json_serializable: ^6.9.4
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  generate: true

# Placeholder brand mark (medical green + "M"); swap assets/icon/* when the real
# logo lands, then rerun: dart run flutter_launcher_icons && dart run flutter_native_splash:create
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#1E8E5A"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#1E8E5A"
  color_dark: "#0B3D2A"
  image: assets/icon/app_icon_foreground.png
  android_12:
    color: "#1E8E5A"
    color_dark: "#0B3D2A"
    image: assets/icon/app_icon_foreground.png
