# Local/production-style stack: the Spring Boot backend + PostgreSQL.
# Copy .env.example to .env and set DB_PASSWORD + JWT_SECRET, then: docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-mawa3id}
      POSTGRES_USER: ${DB_USERNAME:-mawa3id}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mawa3id}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-mawa3id} -d ${DB_NAME:-mawa3id}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-mawa3id}
      DB_USERNAME: ${DB_USERNAME:-mawa3id}
      DB_PASSWORD: ${DB_PASSWORD:-mawa3id}
      # Refuse to boot with a throwaway signing key in a real deployment.
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_FAIL_ON_MISSING_SECRET: ${JWT_FAIL_ON_MISSING_SECRET:-true}
      CLINIC_ZONE: ${CLINIC_ZONE:-UTC}
      # Optional donation settings (card donations stay disabled unless a Stripe key is set).
      DONATIONS_ENABLED: ${DONATIONS_ENABLED:-true}
      PATREON_URL: ${PATREON_URL:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 3s
      start_period: 40s
      retries: 5
    restart: unless-stopped

volumes:
  db-data:
